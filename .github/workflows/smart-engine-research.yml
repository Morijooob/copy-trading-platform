name: Smart Engine Research Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smart-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run smart engine unit tests
        run: node test/smart-trading-engine.test.js
      - name: Run realistic-cost backtester
        run: node test/smart-backtester.test.js
