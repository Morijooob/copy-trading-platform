name: Deploy Copy Trading Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/demo/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let an old deployment block the newest site version.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare demo engine for Pages artifact
        run: |
          mkdir -p site/src/demo
          cp src/demo/demo-trading-engine.js site/src/demo/demo-trading-engine.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
