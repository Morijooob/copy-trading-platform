name: Deploy Copy Trading Site (manual)

# GitHub Pages is deployed automatically by static.yml.
# Keep this workflow manual-only to avoid competing Pages deployments.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Manual static site deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
