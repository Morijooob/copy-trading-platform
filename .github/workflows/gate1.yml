name: Gate 1 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Gate 1 tests
        run: npm test
