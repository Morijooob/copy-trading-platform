name: Gate 1 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main-branch regression matters. Stale runs must not occupy the queue.
concurrency:
  group: gate1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate1:
    name: Gate 1 deterministic test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify test files
        run: |
          test -f package.json
          test -f test/gate1.test.js
          test -f test/demo-trading-engine.test.js
          test -f test/network-resilience.test.js
          test -f test/persistence-store.test.js
          test -f test/restart-recovery.test.js
          test -f test/risk-engine.test.js
          test -f test/risk-controlled-execution.test.js
          test -f test/real-user-preflight.test.js
          test -f test/exir-user-readonly-client.test.js

      - name: Run single full regression suite
        run: npm test
