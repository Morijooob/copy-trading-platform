name: Real User Gate

on:
  push:
    branches: [main]
    paths:
      - "src/real-user-account.js"
      - "src/exir-adapter.js"
      - "test/real-user-account.test.js"
      - "test/exir-adapter.test.js"
      - ".github/workflows/real-user-gate.yml"
  workflow_dispatch:

jobs:
  real-user-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/real-user-account.test.js
      - run: node test/exir-adapter.test.js
