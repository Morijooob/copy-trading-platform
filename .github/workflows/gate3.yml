name: Gate 3 Tests

on: [push, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: gate3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Gate 3
        run: node test/gate3.test.js
