name: Gate 3 Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run Gate 3
        run: node test/gate3.test.js
