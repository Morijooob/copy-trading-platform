name: Gate 9 Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/gate9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate9:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify Gate 9 files
        run: |
          test -f src/security-control.js
          test -f src/security-controlled-execution.js
          test -f test/gate9.test.js
      - name: Run Gate 9 torture tests
        run: node test/gate9.test.js
