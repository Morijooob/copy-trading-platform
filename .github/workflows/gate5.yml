name: Gate 5 Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/gate5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Gate 5 files
        run: test -f test/gate5.test.js && test -f src/risk-engine.js && test -f src/risk-controlled-execution.js
      - name: Run Gate 5 tests
        run: node test/gate5.test.js
      - name: Run full regression suite
        run: npm test
