name: Paper Exchange MVP

on:
  push:
    branches: [main, feature/mvp-paper-exchange]
    paths:
      - 'src/**'
      - 'test/**'
      - 'paper-ui/**'
      - 'paper-server.mjs'
      - 'package.json'
      - '.github/workflows/paper-exchange.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Paper Exchange unit tests
        run: node --test test/paper-exchange.test.js
      - name: Run Copy + Paper Exchange integration tests
        run: node --test test/copy-paper-integration.test.js
      - name: Run Paper Trading API tests
        run: node --test test/paper-trading-api.test.js
      - name: Run Paper Trading HTTP smoke tests
        run: node --test test/paper-server.test.js
      - name: Validate Paper Trading UI
        run: test -f paper-ui/index.html && grep -q "Paper Trading" paper-ui/index.html
      - name: Run full regression
        run: npm test
