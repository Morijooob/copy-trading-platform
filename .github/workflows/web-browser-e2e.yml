name: Web Browser E2E

on:
  pull_request:
  push:
    branches: [feature/sandbox-exchange-adapter]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node web-server.mjs > /tmp/copy-trading-web.log 2>&1 & echo $! > /tmp/web.pid
      - run: node -e "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      - name: Run browser E2E smoke
        run: BASE_URL=http://127.0.0.1:3000 node test/web-browser-e2e.mjs
      - if: always()
        run: cat /tmp/copy-trading-web.log
