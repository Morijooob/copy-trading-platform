name: Copy Trading Authoritative CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copy-trading-authoritative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Authoritative production regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify repository invariants
        run: |
          set -euo pipefail
          test -f package.json
          test -f src/demo/demo-trading-engine.js
          test -f test/demo-trading-engine.test.js
          test -f test/real-engine-demo-parity.test.js
          test -f test/safe-execution-simulator.test.js
          test -f test/copy-trading-admission-and-fanout.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Publish test summary
        if: always()
        run: |
          {
            echo '## Copy Trading Authoritative CI'
            echo "- Commit: $GITHUB_SHA"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
          } >> "$GITHUB_STEP_SUMMARY"
