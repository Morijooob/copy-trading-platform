name: Sandbox Exchange Adapter

on:
  push:
    branches: ["feature/sandbox-exchange-adapter", "feature/persistence-hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-adapter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify sandbox adapter files
        run: |
          test -f package.json
          test -f test/sandbox-exchange-adapter.test.js
          test -f test/binance-sandbox-adapter.test.js
          test -f test/copy-trading-mode.test.js
      - name: Run sandbox adapter tests
        run: node --test test/sandbox-exchange-adapter.test.js test/binance-sandbox-adapter.test.js
      - name: Run copy-trading mode regression
        run: node test/copy-trading-mode.test.js
