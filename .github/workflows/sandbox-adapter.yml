name: Sandbox Exchange Adapter

on:
  push:
    branches: ["feature/sandbox-exchange-adapter"]
  pull_request:
    branches: ["main"]

jobs:
  sandbox-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run sandbox adapter tests
        run: node --test test/sandbox-exchange-adapter.test.js
      - name: Run full regression
        run: npm test
