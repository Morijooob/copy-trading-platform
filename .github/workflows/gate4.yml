name: Gate 4 Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run Gate 4
        run: node test/gate4.test.js
      - name: Run network resilience tests
        run: node test/network-resilience.test.js
