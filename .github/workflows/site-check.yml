name: Site Check
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-check.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run site smoke test
        run: node site/smoke-test.mjs
