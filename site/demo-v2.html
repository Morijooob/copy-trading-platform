<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copy Trading Demo</title><style>body{font-family:system-ui;background:#07111f;color:#fff;margin:0;padding:16px}main{max-width:850px;margin:auto}.card{background:#0d1b2d;border:1px solid #29435f;border-radius:16px;padding:16px;margin:12px 0}.actions{display:flex;flex-wrap:wrap;gap:10px}button{min-height:48px;padding:0 16px;border-radius:10px;border:1px solid #42617d;background:#17304a;color:#fff;font-weight:700}button:active{transform:scale(.97)}.primary{background:#176b49}.danger{background:#642535}.box{background:#091524;padding:12px;border-radius:10px;margin:8px 0}.ok{color:#62e69a}.warn{color:#ffd166}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="card"><h1>دموی موتور هوشمند کپی‌تریدینگ</h1><p id="status">آماده</p><div class="actions"><button id="start" class="primary">شروع دمو</button><button id="stop">توقف</button><button id="cycle">یک چرخه</button><button id="close" class="danger">بستن پوزیشن</button><button id="reset">بازنشانی</button><button id="engineTest">تست قطعی موتور</button></div><div id="message" class="box">برای شروع یکی از دکمه‌ها را بزنید.</div></section><section class="card"><h2>وضعیت بازار</h2><div class="grid"><div class="box">BTC/USDT<br><b id="btc">در انتظار</b></div><div class="box">ETH/USDT<br><b id="eth">در انتظار</b></div><div class="box">SOL/USDT<br><b id="sol">در انتظار</b></div><div class="box">سیگنال<br><b id="signal">NO TRADE</b></div></div></section><section class="card"><h2>حساب دمو</h2><div class="grid"><div class="box">سرمایه: <b id="capital">100 USDT</b></div><div class="box">پوزیشن: <b id="position">FLAT</b></div><div class="box">سود/زیان: <b id="pnl">0.00 USDT</b></div><div class="box">چرخه: <b id="cycles">0</b></div></div></section><section class="card"><h2>رویدادها</h2><div id="feed">هنوز رویدادی ثبت نشده است.</div></section></main><script>const $=id=>document.getElementById(id);let running=false,position=false,cycles=0,pnl=0,timer=null;function log(t){$('feed').innerHTML='<div class="box">'+new Date().toLocaleTimeString('fa-IR')+' · '+t+'</div>'+$('feed').innerHTML}function render(){ $('status').textContent=running?'در حال اجرا':'آماده';$('position').textContent=position?'LONG':'FLAT';$('pnl').textContent=pnl.toFixed(2)+' USDT';$('cycles').textContent=cycles }function cycle(){cycles++;const prices={btc:(60000+Math.random()*5000).toFixed(2),eth:(2500+Math.random()*300).toFixed(2),sol:(130+Math.random()*20).toFixed(2)};$('btc').textContent=prices.btc;$('eth').textContent=prices.eth;$('sol').textContent=prices.sol;$('signal').textContent=position?'HOLD':'NO TRADE';$('message').textContent='چرخه '+cycles+' با موفقیت اجرا شد؛ این فقط شبیه‌سازی است.';log('چرخه '+cycles+' اجرا شد');render()}$('start').onclick=()=>{if(running)return;running=true;log('دمو شروع شد');$('message').textContent='دمو فعال شد.';cycle();clearInterval(timer);timer=setInterval(cycle,15000);render()};$('stop').onclick=()=>{running=false;clearInterval(timer);timer=null;log('دمو متوقف شد');$('message').textContent='دمو متوقف شد.';render()};$('cycle').onclick=()=>cycle();$('close').onclick=()=>{if(!position){$('message').textContent='پوزیشن بازی وجود ندارد.';log('بستن پوزیشن: پوزیشن باز نیست');return}position=false;pnl+=1.25;log('پوزیشن بسته شد · P/L +1.25 USDT');$('message').textContent='پوزیشن مجازی بسته شد.';render()};$('reset').onclick=()=>{running=false;position=false;cycles=0;pnl=0;clearInterval(timer);timer=null;$('btc').textContent='در انتظار';$('eth').textContent='در انتظار';$('sol').textContent='در انتظار';$('signal').textContent='NO TRADE';$('feed').textContent='هنوز رویدادی ثبت نشده است.';$('message').textContent='دمو بازنشانی شد.';render()};$('engineTest').onclick=()=>{const tests=[typeof cycle==='function',typeof render==='function',typeof log==='function',!!$('start')&&!!$('stop')&&!!$('cycle')];if(tests.every(Boolean)){$('message').innerHTML='<span class="ok">ENGINE TEST PASS — همه کنترل‌های اصلی سالم هستند.</span>';log('ENGINE TEST PASS')}else{$('message').innerHTML='<span class="warn">ENGINE TEST FAIL</span>'}};render();</script></body></html>
