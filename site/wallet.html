<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کیف پول | Copy Trading</title><link rel="stylesheet" href="./styles.css?v=11"><style>body{padding:24px}.wallet{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.box{padding:20px;border-radius:18px;border:1px solid #ffffff18;background:#ffffff08}.value{font-size:28px;font-weight:800;margin-top:8px}.muted{opacity:.7}.tx{margin-top:18px}.row{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #ffffff12}.btn{display:inline-block;padding:10px 16px;border-radius:12px;text-decoration:none;background:#ffffff12;color:inherit}.error{color:#ff8b8b;margin-top:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.row{flex-direction:column}}</style></head><body><main class="wallet"><div class="top"><div><div class="eyebrow">COPY TRADING WALLET</div><h1>کیف پول من</h1><p class="muted">موجودی داخلی پلتفرم، سود و کارمزدها</p></div><a class="btn" href="./index.html?v=25">بازگشت به سایت</a></div><section class="grid"><div class="box"><div class="muted">موجودی قابل استفاده</div><div id="balance" class="value">— USDT</div></div><div class="box"><div class="muted">موجودی قفل‌شده</div><div id="locked" class="value">— USDT</div></div><div class="box"><div class="muted">موجودی کل</div><div id="total" class="value">— USDT</div></div></section><section class="box tx"><h2>تراکنش‌ها</h2><div id="transactions" class="muted">در حال بارگذاری…</div><div id="status" class="error"></div><div class="actions"><a class="btn" href="./index.html?v=25">انتخاب مستر دمو</a><a class="btn" href="./index.html?v=25#masters">مسترها</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://qjvfzgrtxldehvrproqx.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_HCMabpRuzy4is0uhzn9ALA_3Ybp5rFm';const s=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const $=x=>document.getElementById(x);const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:8});async function load(){const{data:{session}}=await s.auth.getSession();if(!session){$('#transactions').textContent='برای مشاهده کیف پول ابتدا ثبت‌نام یا ورود کنید.';$('#status').textContent='جلسه کاربری پیدا نشد؛ از صفحه اصلی وارد شوید.';return}let{data:w,error:e}=await s.rpc('ensure_wallet',{p_user_id:session.user.id});if(e)throw e;$('#balance').textContent=fmt(w.balance)+' USDT';$('#locked').textContent=fmt(w.locked_balance)+' USDT';$('#total').textContent=fmt(Number(w.balance)+Number(w.locked_balance))+' USDT';const{data:t,error:te}=await s.from('ledger_entries').select('entry_type,amount,currency,created_at,metadata').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(50);if(te)throw te;if(!t?.length){$('#transactions').textContent='کیف پول آماده است؛ هنوز تراکنشی ثبت نشده است.';return}$('#transactions').innerHTML=t.map(x=>`<div class="row"><span>${x.entry_type||'تراکنش'}</span><strong>${fmt(x.amount)} ${x.currency||'USDT'}</strong><span>${new Date(x.created_at).toLocaleString('fa-IR')}</span></div>`).join('')}load().catch(e=>{$('#status').textContent='خطا در بارگذاری کیف پول: '+(e?.message||'خطای نامشخص')});</script></body></html>
