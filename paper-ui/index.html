<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Trading</title><style>body{font-family:system-ui;background:#0b1220;color:#eef2ff;margin:0}.wrap{max-width:1000px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#121c2f;border:1px solid #263552;border-radius:16px;padding:18px}.green{color:#42e6a4}.muted{color:#9aa8bf}button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer}input,select{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #33445f;background:#0d1728;color:white;margin:6px 0 12px}.order{display:flex;justify-content:space-between;border-top:1px solid #263552;padding:12px 0}</style></head>
<body><main class="wrap"><h1>🟢 Paper Trading</h1><p class="muted">محیط آزمایشی — بدون پول واقعی</p><section class="grid"><div class="card"><div class="muted">وضعیت</div><h2 class="green">PAPER</h2></div><div class="card"><div class="muted">تعداد سفارش</div><h2 id="count">0</h2></div><div class="card"><div class="muted">Filled Notional</div><h2 id="notional">0</h2></div></section><section class="card" style="margin-top:14px"><h2>ثبت سفارش آزمایشی</h2><form id="form"><label>Symbol</label><input id="symbol" value="BTCUSDT"><label>Side</label><select id="side"><option>BUY</option><option>SELL</option></select><label>Quantity</label><input id="qty" type="number" step="any" value="1"><label>Price</label><input id="price" type="number" step="any" value="100"><button type="submit">ثبت سفارش</button><span id="msg" class="muted"></span></form></section><section class="card" style="margin-top:14px"><h2>سفارش‌ها</h2><div id="orders" class="muted">هنوز سفارشی نیست.</div></section></main><script>const API='/api';let token=localStorage.paperToken;async function boot(){if(!token){const r=await fetch(API+'/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({accountId:'demo'})});if(r.ok){token=(await r.json()).token;localStorage.paperToken=token}}refresh()}async function refresh(){if(!token)return;const r=await fetch(API+'/dashboard',{headers:{authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();count.textContent=d.orderCount;notional.textContent=Number(d.filledNotional).toFixed(2);orders.innerHTML=d.orders.length?d.orders.map(o=>`<div class="order"><span>${o.symbol} ${o.side}</span><span>${o.status} · ${o.filledQuantity||0}/${o.quantity}</span></div>`).join(''):'هنوز سفارشی نیست.'}form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const r=await fetch(API+'/orders',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({symbol:symbol.value,side:side.value,quantity:qty.value,price:price.value})});const d=await r.json();msg.textContent=r.ok?'ثبت شد ✅':(d.error||'خطا');refresh()};boot();</script></body></html>
